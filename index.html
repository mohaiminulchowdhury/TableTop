<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS // Dynamic AI Tabletop Exercise Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @media print {
      .no-print { display: none !important; }
      body { background-color: #0f172a !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Built-in fallback generator in case API key isn't configured yet
    function buildFallbackInject(turn, totalTurns, config, history) {
      const lastChoice = history.length > 0 ? history[history.length - 1].selectedOption : null;
      const phases = [
        { phase: "Initial Access & Token Replay", mitre: "T1078.004 - Cloud Accounts / T1557 - AiTM", nist: "DETECT (DE.CM)" },
        { phase: "Endpoint Execution & Sensor Tampering", mitre: "T1059 - Command & Scripting / T1562.001 - Disable Tools", nist: "RESPOND (RS.AN)" },
        { phase: "Privilege Escalation & Identity Persistence", mitre: "T1098 - Account Manipulation", nist: "PROTECT (PR.AA)" },
        { phase: "East-West Lateral Movement", mitre: "T1021 - Remote Services", nist: "RESPOND (RS.MI)" },
        { phase: "Staging & Outbound Data Exfiltration", mitre: "T1048 - Exfiltration Over Alternative Protocol", nist: "PROTECT (PR.DS)" },
        { phase: "Backup Sabotage & Snapshot Deletion", mitre: "T1490 - Inhibit System Recovery", nist: "RECOVER (RC.RP)" },
        { phase: "Ransomware Detonation & Extortion Demand", mitre: "T1486 - Data Encrypted for Impact", nist: "GOVERN (GV.RM)" },
        { phase: "Statutory Breach Notification & Media Leak", mitre: "Regulatory & Crisis Comms", nist: "RESPOND (RS.CO)" },
        { phase: "Clean-Room Restoration & Hardening", mitre: "Recovery Validation", nist: "RECOVER (RC.RP)" },
        { phase: "Board Post-Mortem & Audit Defense", mitre: "Post-Incident Governance", nist: "GOVERN (GV.OV)" }
      ];
      const idx = Math.min(turn - 1, phases.length - 1);
      const p = phases[idx];

      return {
        phase: p.phase,
        mitre: p.mitre,
        nist: p.nist,
        timeJumpMinutes: 40,
        severity: turn >= totalTurns - 1 ? "CRITICAL" : "HIGH",
        title: `${p.phase} Targeting ${config.crownJewels}`,
        narrative: `${
          lastChoice
            ? `Following your decision to "${lastChoice.label}", the adversary (${config.threatActor}) adapted their tradecraft. `
            : `Initial high-severity telemetry alerts fire across ${config.orgName} (${config.industry}). `
        }Adversary activity linked to ${config.initialVector} is now actively threatening ${config.crownJewels} within your ${config.infra} environment. With ${config.regulation} statutory obligations in play, leadership demands an immediate operational call.`,
        telemetryArtifact: `// ${config.stack} Live Hunt Query — Inject #${turn}\nSecurityAlert\n| where TimeGenerated > ago(45m)\n| where CompromisedEntity has "${config.crownJewels.split(" ")[0].toLowerCase()}-prod-0${turn}"\n| project TimeGenerated, AlertSeverity="High", Tactic="${p.phase}",\n  InitiatingAccount="svc-prod-deploy@${config.orgName.toLowerCase().replace(/[^a-z0-9]/g, '')}.com",\n  SourceIP="185.220.101.${10 + turn}", CommandLine="rundll32.exe comsvcs.dll, MiniDump"\n\n[CORRELATION]: ${lastChoice ? `Post-action state after '${lastChoice.label}' verified.` : "Anomalous session token replay confirmed."}`,
        commsArtifact: `[WAR ROOM BRIDGE — ${config.role.toUpperCase()}]\nCISO: "We are at Inject ${turn} of ${totalTurns}. ${
          lastChoice ? `Our last move (${lastChoice.label}) shifted our posture, but ` : ""
        }the threat actor is pushing toward ${config.crownJewels}."\nGeneral Counsel: "Remember our reporting window under ${config.regulation}. Every action we take right now must be forensically defensible."`,
        dilemmaSummary: `Balance rapid technical containment of ${config.crownJewels} against production uptime and ${config.regulation} forensic evidence preservation.`,
        options: [
          {
            id: "A",
            label: "Enforce Surgical Isolation & Capture Volatile Forensics",
            tacticTag: "Forensic Containment",
            desc: `Isolate the affected ${config.infra} workload at the EDR/identity layer while preserving memory and packet captures for ${config.regulation} auditors.`,
            impact: { containment: 20, uptime: -10, compliance: 15, trust: 10 },
            estimatedCostDeltaUSD: 25000,
            outcome: `Targeted containment severed the attacker's active session while preserving cryptographic evidence, causing minor latency on secondary services.`,
            critique: `Strong alignment with NIST CSF 2.0 (RS.MI & RS.AN). Preserving volatile forensics before eradication is vital for ${config.regulation} defense.`
          },
          {
            id: "B",
            label: "Execute Aggressive Enterprise-Wide Lockdown",
            tacticTag: "Maximum Containment",
            desc: `Sever East-West routing and force global token revocation across all ${config.orgName} business units immediately.`,
            impact: { containment: 25, uptime: -25, compliance: 5, trust: -10 },
            estimatedCostDeltaUSD: 140000,
            outcome: `Adversary lateral movement was halted cold, but production operations for ${config.orgName} experienced a 90-minute outage.`,
            critique: `Highly effective technical containment, though high collateral business disruption triggered executive friction.`
          },
          {
            id: "C",
            label: "Deploy Decoy Credentials & Silently Monitor TTPs",
            tacticTag: "Threat Intelligence",
            desc: `Keep the compromised channel open inside a monitored sinkhole to map the full ${config.threatActor} infrastructure.`,
            impact: { containment: -15, uptime: 10, compliance: -10, trust: -5 },
            estimatedCostDeltaUSD: 60000,
            outcome: `Captured additional C2 indicators, but the threat actor used the extra dwell time to stage records from ${config.crownJewels}.`,
            critique: `High-risk choice during an active threat against Crown Jewels; passive monitoring increases data exfiltration exposure.`
          },
          {
            id: "D",
            label: "Prioritize Business Continuity & Apply Partial Firewall Blocks",
            tacticTag: "Uptime Priority",
            desc: `Block only the known external IP indicators at the perimeter firewall so customer-facing production systems stay at 100% capacity.`,
            impact: { containment: -10, uptime: 15, compliance: -15, trust: -10 },
            estimatedCostDeltaUSD: 95000,
            outcome: `Zero immediate downtime, but the attacker rotated to a new residential proxy IP within 4 minutes and retained internal persistence.`,
            critique: `IP-only blocking (Pyramid of Pain bottom tier) fails to evict an adversary who already possesses valid identity tokens.`
          }
        ]
      };
    }

    function App() {
      const [screen, setScreen] = useState("wizard"); // wizard | exercise | report
      const [engineMode, setEngineMode] = useState("ai"); // ai | offline
      const [clientApiKey, setClientApiKey] = useState("");
      const [showKeyModal, setShowKeyModal] = useState(false);

      const [config, setConfig] = useState({
        orgName: "Apex Horizon Financial",
        industry: "Finance & Banking",
        infra: "Hybrid Identity & Multi-Cloud (Azure + AWS)",
        crownJewels: "Customer PII & SWIFT Payment Rails",
        stack: "Microsoft Sentinel + Defender XDR + Entra ID",
        threatActor: "LockBit / BlackCat RaaS Syndicate",
        initialVector: "AiTM Spear-Phishing & Session Token Replay",
        regulation: "APRA CPS 234 & GDPR",
        role: "Technical SOC & Incident Response Lead",
        injectCount: 5,
        difficulty: "Standard",
        customNotes: ""
      });

      const [turn, setTurn] = useState(1);
      const [elapsedMinutes, setElapsedMinutes] = useState(15);
      const [financialImpact, setFinancialImpact] = useState(35000);
      const [metrics, setMetrics] = useState({
        containment: 60,
        uptime: 95,
        compliance: 80,
        trust: 85
      });

      const [currentInject, setCurrentInject] = useState(null);
      const [activeTab, setActiveTab] = useState("telemetry");
      const [pendingOutcome, setPendingOutcome] = useState(null);
      const [history, setHistory] = useState([]);
      const [aarData, setAarData] = useState(null);

      const [isLoading, setIsLoading] = useState(false);
      const [loadingMessage, setLoadingMessage] = useState("");
      const [apiWarning, setApiWarning] = useState("");

      const clamp = (val) => Math.max(0, Math.min(100, val));

      // Calls Netlify Serverless Function first; falls back to direct browser call if session key provided, or built-in engine
      async function fetchDynamicInject(nextTurn, updatedMetrics, updatedHistory) {
        setIsLoading(true);
        setApiWarning("");
        setLoadingMessage(
          nextTurn === 1
            ? `Synthesizing tailored scenario for ${config.orgName} (${config.stack})...`
            : `AI Engine analyzing your Turn ${nextTurn - 1} decision & generating Inject #${nextTurn}...`
        );

        if (engineMode === "offline") {
          await new Promise((r) => setTimeout(r, 450));
          const fallback = buildFallbackInject(nextTurn, Number(config.injectCount), config, updatedHistory);
          setCurrentInject(fallback);
          setIsLoading(false);
          return;
        }

        try {
          const res = await fetch("/.netlify/functions/ttx-engine", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mode: "generate_inject",
              config,
              turn: nextTurn,
              totalTurns: Number(config.injectCount),
              metrics: updatedMetrics,
              history: updatedHistory,
              clientApiKey
            })
          });

          if (!res.ok) {
            const errJson = await res.json().catch(() => ({}));
            throw new Error(errJson.error || `Server returned ${res.status}`);
          }

          const data = await res.json();
          if (!data || !Array.isArray(data.options) || data.options.length < 4) {
            throw new Error("Incomplete AI JSON payload");
          }
          setCurrentInject(data);
        } catch (err) {
          console.warn("Falling back to local engine:", err.message);
          setApiWarning(
            `Live AI Note: (${err.message}). Using built-in adaptive kill-chain engine for this turn. Set GEMINI_API_KEY in Netlify Environment Variables or click 'API Key Settings' in the top bar.`
          );
          const fallback = buildFallbackInject(nextTurn, Number(config.injectCount), config, updatedHistory);
          setCurrentInject(fallback);
        } finally {
          setIsLoading(false);
        }
      }

      async function startExercise() {
        const penalty = config.difficulty === "Hardcore" ? -12 : 0;
        const initialMetrics = {
          containment: 58 + penalty,
          uptime: 92 + penalty,
          compliance: 78 + penalty,
          trust: 82 + penalty
        };
        setMetrics(initialMetrics);
        setTurn(1);
        setElapsedMinutes(15);
        setFinancialImpact(25000);
        setHistory([]);
        setPendingOutcome(null);
        setAarData(null);
        setScreen("exercise");
        await fetchDynamicInject(1, initialMetrics, []);
      }

      function handleSelectOption(option) {
        const mult = config.difficulty === "Hardcore" ? 1.25 : 1;
        const scale = (v) => Math.round((v || 0) < 0 ? v * mult : v || 0);

        const delta = {
          containment: scale(option.impact?.containment),
          uptime: scale(option.impact?.uptime),
          compliance: scale(option.impact?.compliance),
          trust: scale(option.impact?.trust)
        };

        const nextMetrics = {
          containment: clamp(metrics.containment + delta.containment),
          uptime: clamp(metrics.uptime + delta.uptime),
          compliance: clamp(metrics.compliance + delta.compliance),
          trust: clamp(metrics.trust + delta.trust)
        };

        setMetrics(nextMetrics);
        setFinancialImpact((prev) => prev + (option.estimatedCostDeltaUSD || 35000));
        setPendingOutcome({
          turn,
          phase: currentInject.phase,
          mitre: currentInject.mitre,
          nist: currentInject.nist,
          title: currentInject.title,
          selectedOption: option,
          appliedImpact: delta,
          metricsAfter: nextMetrics
        });
      }

      async function handleNextTurn() {
        const updatedHistory = [...history, pendingOutcome];
        setHistory(updatedHistory);
        const nextMetrics = pendingOutcome.metricsAfter;
        const timeJump = currentInject.timeJumpMinutes || 45;
        setElapsedMinutes((prev) => prev + timeJump);
        setPendingOutcome(null);
        setActiveTab("telemetry");

        if (turn < Number(config.injectCount)) {
          const nextTurnNum = turn + 1;
          setTurn(nextTurnNum);
          await fetchDynamicInject(nextTurnNum, nextMetrics, updatedHistory);
        } else {
          // Generate Final Executive AAR
          setScreen("report");
          if (engineMode === "ai") {
            setIsLoading(true);
            setLoadingMessage("Compiling Executive After-Action Report (NIST CSF 2.0 & MITRE Mapping)...");
            try {
              const res = await fetch("/.netlify/functions/ttx-engine", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  mode: "generate_aar",
                  config,
                  totalTurns: Number(config.injectCount),
                  metrics: nextMetrics,
                  history: updatedHistory,
                  clientApiKey
                })
              });
              if (res.ok) {
                const reportJson = await res.json();
                setAarData(reportJson);
              }
            } catch (e) {
              console.warn("Using structured local AAR calculation:", e);
            } finally {
              setIsLoading(false);
            }
          }
        }
      }

      const formatClock = (mins) => {
        const hrs = String(Math.floor(mins / 60)).padStart(2, "0");
        const m = String(mins % 60).padStart(2, "0");
        return `T+${hrs}:${m}:00`;
      };

      const overallScore = Math.round(
        metrics.containment * 0.35 +
        metrics.uptime * 0.2 +
        metrics.compliance * 0.25 +
        metrics.trust * 0.2
      );

      const getGradeInfo = (score) => {
        if (score >= 88) return { grade: "S", label: "Optimizing (CMMI Level 5)", css: "text-emerald-400 border-emerald-500/40 bg-emerald-500/10" };
        if (score >= 76) return { grade: "A", label: "Managed (CMMI Level 4)", css: "text-cyan-400 border-cyan-500/40 bg-cyan-500/10" };
        if (score >= 64) return { grade: "B", label: "Defined (CMMI Level 3)", css: "text-blue-400 border-blue-500/40 bg-blue-500/10" };
        if (score >= 50) return { grade: "C", label: "Developing (CMMI Level 2)", css: "text-amber-400 border-amber-500/40 bg-amber-500/10" };
        return { grade: "F", label: "Ad-Hoc / Exposed (Level 1)", css: "text-rose-400 border-rose-500/40 bg-rose-500/10" };
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30 no-print">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-cyan-500/15 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-extrabold font-mono">
                  TTX
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold tracking-tight text-white text-lg">AEGIS // AI CYBER RANGE</span>
                    <span className="text-[11px] px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-mono">
                      {engineMode === "ai" ? "● LIVE AI ENGINE" : "○ OFFLINE ENGINE"}
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Dynamic Context-Chained Incident Response & Executive Simulator</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowKeyModal(true)}
                  className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 font-mono transition"
                >
                  ⚙ API / Engine Settings
                </button>
                {screen !== "wizard" && (
                  <button
                    onClick={() => setScreen("wizard")}
                    className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                  >
                    New Exercise
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Modal for Optional Session API Key or Mode Toggle */}
          {showKeyModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white">AI Generation Engine Settings</h3>
                  <button onClick={() => setShowKeyModal(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                  <p>
                    <strong>Production Mode (Recommended):</strong> Store your key as <code className="text-cyan-400">GEMINI_API_KEY</code> in your <strong>Netlify Site Configuration → Environment Variables</strong> (or use Netlify's automatic AI Gateway). That way your key is never exposed in browser code.
                  </p>
                  <p>
                    <strong>Optional Session Override:</strong> If you are testing locally or haven't set the Netlify variable yet, you can paste a key below for this browser tab only:
                  </p>
                  <input
                    type="password"
                    placeholder="Paste Gemini API Key (optional if set in Netlify)..."
                    value={clientApiKey}
                    onChange={(e) => setClientApiKey(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white font-mono text-xs"
                  />
                  <div className="pt-2">
                    <label className="block text-slate-400 mb-1.5">Engine Mode:</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => setEngineMode("ai")}
                        className={`py-2 rounded-lg border font-semibold ${
                          engineMode === "ai" ? "bg-cyan-500/20 border-cyan-400 text-cyan-300" : "bg-slate-950 border-slate-800 text-slate-400"
                        }`}
                      >
                        Live AI Generation (Default)
                      </button>
                      <button
                        onClick={() => setEngineMode("offline")}
                        className={`py-2 rounded-lg border font-semibold ${
                          engineMode === "offline" ? "bg-cyan-500/20 border-cyan-400 text-cyan-300" : "bg-slate-950 border-slate-800 text-slate-400"
                        }`}
                      >
                        Instant Offline Engine
                      </button>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowKeyModal(false)}
                    className="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs"
                  >
                    Save & Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Loading Overlay when AI generates custom inject */}
          {isLoading && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-40 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-cyan-500/40 rounded-2xl p-8 max-w-md w-full text-center space-y-4 shadow-2xl">
                <div className="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <div className="text-xs font-mono uppercase tracking-widest text-cyan-400">Dynamic Scenario Synthesis</div>
                <p className="text-sm font-semibold text-white">{loadingMessage}</p>
                <p className="text-xs text-slate-400">
                  Crafting stack-specific telemetry ({config.stack.split("+")[0]}), stakeholder comms, and 4 balanced operational trade-offs...
                </p>
              </div>
            </div>
          )}

          {/* SCREEN 1: DEEP-TAILORING WIZARD */}
          {screen === "wizard" && (
            <main className="max-w-6xl mx-auto w-full px-4 py-8 space-y-8">
              <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-cyan-950/30 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
                <div className="max-w-3xl space-y-2">
                  <span className="text-xs font-mono uppercase tracking-widest text-cyan-400">
                    Step 1 // Scenario Scoping & Tailoring
                  </span>
                  <h1 className="text-2xl md:text-3xl font-extrabold text-white">
                    Design Your Custom Tabletop Exercise
                  </h1>
                  <p className="text-slate-400 text-sm">
                    Every parameter below is fed into the AI Scenario Architect. Each subsequent inject will dynamically react to the exact option your participants choose.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Col 1 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-5 space-y-4">
                    <h2 className="text-xs font-mono font-bold uppercase tracking-wider text-cyan-400 border-b border-slate-800 pb-2">
                      1. Organization & Target Environment
                    </h2>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Organization Name</label>
                      <input
                        type="text"
                        value={config.orgName}
                        onChange={(e) => setConfig({ ...config, orgName: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Industry Vertical</label>
                      <select
                        value={config.industry}
                        onChange={(e) => setConfig({ ...config, industry: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option>Finance & Banking</option>
                        <option>Healthcare & Pharmaceutical</option>
                        <option>Critical Infrastructure (Energy / Water / Aviation)</option>
                        <option>Telecommunications & ISP</option>
                        <option>Retail & Global E-Commerce</option>
                        <option>Enterprise SaaS & AI Technology</option>
                        <option>Government & Defense</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Architecture & Infrastructure Footprint</label>
                      <select
                        value={config.infra}
                        onChange={(e) => setConfig({ ...config, infra: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option>Hybrid Identity & Multi-Cloud (Azure + AWS)</option>
                        <option>Microsoft-Centric Cloud + On-Prem Active Directory</option>
                        <option>Cloud-Native Containerized (EKS / AKS / Serverless)</option>
                        <option>IT/OT Converged Industrial Network (SCADA / ICS)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Crown Jewels (Primary Asset Targeted)</label>
                      <select
                        value={config.crownJewels}
                        onChange={(e) => setConfig({ ...config, crownJewels: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option>Customer PII & SWIFT Payment Rails</option>
                        <option>Patient Electronic Health Records & Clinical Systems</option>
                        <option>Proprietary Source Code, CI/CD & Production Signing Keys</option>
                        <option>SCADA / Operational Distribution Control Systems</option>
                        <option>Executive M&A Strategy & Regulated Financial Filings</option>
                      </select>
                    </div>
                  </div>

                  {/* Col 2 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-5 space-y-4">
                    <h2 className="text-xs font-mono font-bold uppercase tracking-wider text-cyan-400 border-b border-slate-800 pb-2">
                      2. Security Tooling & Threat Actor Profile
                    </h2>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">SIEM / XDR / Identity Stack (Generates Matching Logs)</label>
                      <select
                        value={config.stack}
                        onChange={(e) => setConfig({ ...config, stack: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option>Microsoft Sentinel + Defender XDR + Entra ID</option>
                        <option>Splunk Enterprise + CrowdStrike Falcon + Okta</option>
                        <option>Google SecOps (Chronicle) + Palo Alto Cortex XDR</option>
                        <option>Elastic Security + SentinelOne + Ping Identity</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Adversary / Threat Actor Archetype</label>
                      <select
                        value={config.threatActor}
                        onChange={(e) => setConfig({ ...config, threatActor: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option>LockBit / BlackCat RaaS Syndicate (Double Extortion)</option>
                        <option>Scattered Spider (Helpdesk Social Engineering & Identity Takeover)</option>
                        <option>Nation-State APT (Volt Typhoon / Cozy Bear Stealth Living-off-the-Land)</option>
                        <option>Malicious Insider / Compromised Managed Service Provider (MSP)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Initial Access Vector</label>
                      <select
                        value={config.initialVector}
                        onChange={(e) => setConfig({ ...config, initialVector: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option>AiTM Spear-Phishing & Session Token Replay</option>
                        <option>Zero-Day Exploit on Edge VPN / Firewall Appliance</option>
                        <option>IT Helpdesk Voice Vishing & MFA Push Fatigue</option>
                        <option>Compromised 3rd-Party Vendor API / CI/CD Dependency</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Primary Regulatory & Compliance Regime</label>
                      <select
                        value={config.regulation}
                        onChange={(e) => setConfig({ ...config, regulation: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option>APRA CPS 234 & Australian Privacy Act</option>
                        <option>SOCI Act (Critical Infrastructure) & ASD Mandatory Reporting</option>
                        <option>GDPR & NIS2 Directive (72-Hour Window)</option>
                        <option>SEC 4-Day Materiality Rule & PCI-DSS v4.0</option>
                        <option>HIPAA & HITECH Breach Notification Rule</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* Section 3: Length, Audience, Custom Prompt */}
                <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-5 space-y-4">
                  <h2 className="text-xs font-mono font-bold uppercase tracking-wider text-cyan-400 border-b border-slate-800 pb-2">
                    3. Exercise Mechanics, Inject Count & Custom Scenario Notes
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                      <label className="block text-xs text-slate-300 mb-2">Number of Injects (Exercise Depth)</label>
                      <div className="grid grid-cols-4 gap-2">
                        {[3, 5, 7, 10].map((cnt) => (
                          <button
                            key={cnt}
                            type="button"
                            onClick={() => setConfig({ ...config, injectCount: cnt })}
                            className={`py-2.5 rounded-lg border font-mono text-sm font-bold transition ${
                              config.injectCount === cnt
                                ? "bg-cyan-500/20 border-cyan-400 text-cyan-300"
                                : "bg-slate-900 border-slate-800 text-slate-400"
                            }`}
                          >
                            {cnt}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-300 mb-2">Participant Role Lens</label>
                      <select
                        value={config.role}
                        onChange={(e) => setConfig({ ...config, role: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white"
                      >
                        <option>Technical SOC & Incident Response Lead</option>
                        <option>CISO & Executive Crisis Management Team</option>
                        <option>GRC, Legal Counsel & Communications</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-300 mb-2">Difficulty / Pressure</label>
                      <div className="grid grid-cols-2 gap-2">
                        {["Standard", "Hardcore"].map((d) => (
                          <button
                            key={d}
                            type="button"
                            onClick={() => setConfig({ ...config, difficulty: d })}
                            className={`py-2.5 rounded-lg border text-xs font-bold transition ${
                              config.difficulty === d
                                ? d === "Hardcore"
                                  ? "bg-rose-500/20 border-rose-500 text-rose-300"
                                  : "bg-cyan-500/20 border-cyan-400 text-cyan-300"
                                : "bg-slate-900 border-slate-800 text-slate-400"
                            }`}
                          >
                            {d}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">
                      Optional Custom Scenario Focus (e.g., "Include a compromised Logic App playbook" or "CEO is unreachable on a flight")
                    </label>
                    <input
                      type="text"
                      placeholder="Add any custom twist or specific technology you want tested..."
                      value={config.customNotes}
                      onChange={(e) => setConfig({ ...config, customNotes: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={startExercise}
                    className="px-6 py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-extrabold text-sm tracking-wide shadow-lg shadow-cyan-500/20 transition"
                  >
                    Generate & Launch Tailored Exercise ({config.injectCount} Injects) →
                  </button>
                </div>
              </div>
            </main>
          )}

          {/* SCREEN 2: INTERACTIVE COMMAND CENTER */}
          {screen === "exercise" && currentInject && (
            <main className="max-w-7xl mx-auto w-full px-4 py-6 space-y-5">
              {apiWarning && (
                <div className="bg-amber-500/10 border border-amber-500/40 text-amber-300 px-4 py-2.5 rounded-xl text-xs flex items-center justify-between">
                  <span>{apiWarning}</span>
                  <button onClick={() => setShowKeyModal(true)} className="underline font-bold ml-4 shrink-0">
                    Configure Key
                  </button>
                </div>
              )}

              {/* Top Telemetry Bar */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
                <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-3 mb-4">
                  <div className="flex items-center gap-3">
                    <span className="px-2.5 py-1 rounded bg-rose-500/20 border border-rose-500/40 text-rose-400 font-mono text-xs font-bold animate-pulse">
                      ● {currentInject.severity || "CRITICAL"}
                    </span>
                    <span className="text-sm font-bold text-white">{config.orgName}</span>
                    <span className="text-xs text-slate-400 font-mono hidden md:inline">[{config.stack}]</span>
                  </div>

                  <div className="flex flex-wrap items-center gap-3 font-mono text-xs">
                    <div className="bg-slate-950 px-3 py-1.5 rounded border border-slate-800">
                      <span className="text-slate-400">INJECT: </span>
                      <span className="text-cyan-400 font-bold">{turn} / {config.injectCount}</span>
                    </div>
                    <div className="bg-slate-950 px-3 py-1.5 rounded border border-slate-800">
                      <span className="text-slate-400">CLOCK: </span>
                      <span className="text-amber-400 font-bold">{formatClock(elapsedMinutes)}</span>
                    </div>
                    <div className="bg-slate-950 px-3 py-1.5 rounded border border-slate-800">
                      <span className="text-slate-400">EST. IMPACT: </span>
                      <span className="text-rose-400 font-bold">${financialImpact.toLocaleString()}</span>
                    </div>
                  </div>
                </div>

                {/* 4 KPI Meters */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {[
                    { label: "Technical Containment", val: metrics.containment, color: "bg-cyan-500" },
                    { label: "Business Continuity (Uptime)", val: metrics.uptime, color: "bg-emerald-500" },
                    { label: `${config.regulation.split(" ")[0]} Compliance`, val: metrics.compliance, color: "bg-blue-500" },
                    { label: "Board & Public Trust", val: metrics.trust, color: "bg-purple-500" }
                  ].map((m) => (
                    <div key={m.label} className="bg-slate-950/90 border border-slate-800 rounded-lg p-3">
                      <div className="flex justify-between text-xs mb-1.5">
                        <span className="text-slate-400 font-medium">{m.label}</span>
                        <span className="font-mono font-bold text-white">{m.val}%</span>
                      </div>
                      <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                        <div className={`${m.color} h-full transition-all duration-500`} style={{ width: `${m.val}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Split Workspace */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* Left: Narrative & Evidence */}
                <div className="lg:col-span-7 space-y-5">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="text-xs font-mono uppercase px-2.5 py-1 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                        Inject #{turn}: {currentInject.phase}
                      </span>
                      <span className="text-xs font-mono text-slate-400">{currentInject.mitre}</span>
                    </div>

                    <h2 className="text-xl font-bold text-white">{currentInject.title}</h2>
                    <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-line">
                      {currentInject.narrative}
                    </p>

                    {currentInject.dilemmaSummary && (
                      <div className="bg-slate-950/90 border-l-4 border-cyan-500 p-3 text-xs text-slate-300">
                        <strong className="text-cyan-400 uppercase font-mono mr-2">Core Dilemma:</strong>
                        {currentInject.dilemmaSummary}
                      </div>
                    )}

                    {/* Evidence Tabs */}
                    <div className="pt-2">
                      <div className="flex border-b border-slate-800 text-xs font-medium">
                        <button
                          onClick={() => setActiveTab("telemetry")}
                          className={`px-4 py-2.5 border-b-2 transition ${
                            activeTab === "telemetry"
                              ? "border-cyan-400 text-cyan-400 bg-slate-950/60"
                              : "border-transparent text-slate-400 hover:text-slate-200"
                          }`}
                        >
                          Live {config.stack.split("+")[0].trim()} Telemetry
                        </button>
                        <button
                          onClick={() => setActiveTab("comms")}
                          className={`px-4 py-2.5 border-b-2 transition ${
                            activeTab === "comms"
                              ? "border-cyan-400 text-cyan-400 bg-slate-950/60"
                              : "border-transparent text-slate-400 hover:text-slate-200"
                          }`}
                        >
                          War Room & Stakeholder Feed
                        </button>
                      </div>

                      <div className="bg-slate-950 border border-t-0 border-slate-800 rounded-b-xl p-4 font-mono text-xs leading-relaxed overflow-x-auto">
                        {activeTab === "telemetry" ? (
                          <pre className="text-emerald-400 whitespace-pre-wrap">{currentInject.telemetryArtifact}</pre>
                        ) : (
                          <div className="text-amber-300 whitespace-pre-wrap">{currentInject.commsArtifact}</div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Right: 4 Options or Outcome Drawer */}
                <div className="lg:col-span-5">
                  {!pendingOutcome ? (
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                      <div>
                        <span className="text-xs font-mono uppercase text-cyan-400">Response Decision</span>
                        <h3 className="text-lg font-bold text-white">Choose Your Tactical Action</h3>
                        <p className="text-xs text-slate-400">
                          Your selection will directly dictate how the AI generates Inject #{turn + 1}.
                        </p>
                      </div>

                      <div className="space-y-3">
                        {currentInject.options.map((opt, idx) => (
                          <button
                            key={opt.id || idx}
                            onClick={() => handleSelectOption(opt)}
                            className="w-full text-left p-4 rounded-xl bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-cyan-500/60 transition group"
                          >
                            <div className="flex items-start gap-3">
                              <span className="w-6 h-6 rounded bg-slate-800 group-hover:bg-cyan-500 group-hover:text-slate-950 text-cyan-400 font-mono text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 transition">
                                {opt.id || String.fromCharCode(65 + idx)}
                              </span>
                              <div className="space-y-1">
                                <div className="flex flex-wrap items-center gap-2">
                                  <span className="font-semibold text-sm text-white group-hover:text-cyan-300">
                                    {opt.label}
                                  </span>
                                  {opt.tacticTag && (
                                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-400">
                                      {opt.tacticTag}
                                    </span>
                                  )}
                                </div>
                                <p className="text-xs text-slate-400 leading-relaxed">{opt.desc}</p>
                              </div>
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div className="bg-slate-900 border-2 border-cyan-500/50 rounded-xl p-6 space-y-5 shadow-2xl">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono uppercase px-2.5 py-1 rounded bg-cyan-500/20 text-cyan-300 font-bold">
                          Decision Logged
                        </span>
                        <span className="text-xs font-mono text-slate-400">{pendingOutcome.nist}</span>
                      </div>

                      <div>
                        <h3 className="text-base font-bold text-white">{pendingOutcome.selectedOption.label}</h3>
                        <p className="text-sm text-slate-300 mt-2 leading-relaxed bg-slate-950 p-3.5 rounded-lg border border-slate-800">
                          {pendingOutcome.selectedOption.outcome}
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                        {Object.entries(pendingOutcome.appliedImpact).map(([k, v]) => (
                          <div key={k} className="bg-slate-950 px-3 py-2 rounded border border-slate-800 flex justify-between">
                            <span className="capitalize text-slate-400">{k}:</span>
                            <span className={v > 0 ? "text-emerald-400 font-bold" : v < 0 ? "text-rose-400 font-bold" : "text-slate-400"}>
                              {v > 0 ? `+${v}%` : `${v}%`}
                            </span>
                          </div>
                        ))}
                      </div>

                      <div className="bg-blue-950/30 border border-blue-500/30 rounded-lg p-3.5">
                        <div className="text-xs font-bold text-blue-300 uppercase tracking-wider mb-1">
                          Advisory Critique
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{pendingOutcome.selectedOption.critique}</p>
                      </div>

                      <button
                        onClick={handleNextTurn}
                        className="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition"
                      >
                        {turn < Number(config.injectCount)
                          ? `Synthesize Next Inject (${turn + 1} of ${config.injectCount}) →`
                          : "Generate Final Executive After-Action Report →"}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </main>
          )}

          {/* SCREEN 3: EXECUTIVE AFTER-ACTION REPORT */}
          {screen === "report" && (
            <main className="max-w-6xl mx-auto w-full px-4 py-8 space-y-8">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 space-y-8 shadow-2xl">
                <div className="flex flex-wrap items-start justify-between gap-4 border-b border-slate-800 pb-6">
                  <div>
                    <span className="text-xs font-mono uppercase tracking-widest text-cyan-400">
                      Post-Exercise Debrief & Maturity Assessment
                    </span>
                    <h1 className="text-2xl md:text-3xl font-extrabold text-white mt-1">
                      Executive After-Action Report (AAR)
                    </h1>
                    <p className="text-xs text-slate-400 mt-1">
                      Organization: <strong className="text-white">{config.orgName}</strong> ({config.industry}) | Stack: {config.stack} | Framework: {config.regulation}
                    </p>
                  </div>
                  <div className="flex gap-3 no-print">
                    <button
                      onClick={() => window.print()}
                      className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-white border border-slate-700"
                    >
                      Print / Export PDF
                    </button>
                    <button
                      onClick={() => setScreen("wizard")}
                      className="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-xs font-bold text-slate-950"
                    >
                      New Exercise
                    </button>
                  </div>
                </div>

                {/* Grade & Executive Summary */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                  <div className={`border rounded-2xl p-6 text-center ${getGradeInfo(overallScore).css}`}>
                    <div className="text-xs font-mono uppercase">Resilience Rating</div>
                    <div className="text-6xl font-extrabold my-2">{getGradeInfo(overallScore).grade}</div>
                    <div className="text-sm font-semibold">{overallScore}/100 — {getGradeInfo(overallScore).label}</div>
                  </div>

                  <div className="md:col-span-2 bg-slate-950 border border-slate-800 rounded-2xl p-6 space-y-3">
                    <h2 className="text-base font-bold text-white">Executive Summary</h2>
                    <p className="text-xs text-slate-300 leading-relaxed whitespace-pre-line">
                      {aarData?.executiveSummary ||
                        `Across ${config.injectCount} dynamic injects simulating a ${config.threatActor} intrusion via ${config.initialVector}, ${config.orgName} achieved an overall resilience score of ${overallScore}%. Final technical containment stood at ${metrics.containment}%, business continuity at ${metrics.uptime}%, and ${config.regulation} compliance posture at ${metrics.compliance}%.`}
                    </p>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400">Crown Jewels</div>
                        <div className="text-xs font-mono font-bold text-cyan-400">
                          {aarData?.crownJewelsVerdict || (metrics.containment >= 75 ? "PROTECTED" : "PARTIALLY EXPOSED")}
                        </div>
                      </div>
                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400">{config.regulation.split(" ")[0]} Status</div>
                        <div className="text-xs font-mono font-bold text-emerald-400">
                          {aarData?.regulatoryVerdict || (metrics.compliance >= 75 ? "DEFENSIBLE" : "AUDIT EXPOSURE")}
                        </div>
                      </div>
                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400">Total Incident Window</div>
                        <div className="text-xs font-mono font-bold text-amber-400">
                          {aarData?.simulatedMTTR || `${Math.round((elapsedMinutes / 60) * 10) / 10} Hours`}
                        </div>
                      </div>
                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                        <div className="text-[10px] text-slate-400">Simulated Impact</div>
                        <div className="text-xs font-mono font-bold text-rose-400">
                          ${financialImpact.toLocaleString()}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Chronological Decision Audit */}
                <div className="space-y-4">
                  <h2 className="text-lg font-bold text-white border-b border-slate-800 pb-2">
                    Chronological Decision Audit Trail
                  </h2>
                  <div className="space-y-3">
                    {history.map((h, i) => (
                      <div key={i} className="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-2">
                        <div className="flex flex-wrap justify-between gap-2">
                          <span className="text-xs font-mono text-cyan-400 font-bold">
                            INJECT #{h.turn}: {h.phase} ({h.mitre})
                          </span>
                          <span className="text-xs font-mono text-slate-400">{h.nist}</span>
                        </div>
                        <div className="text-sm font-bold text-white">
                          Chosen Action: <span className="text-cyan-300">{h.selectedOption.label}</span>
                        </div>
                        <p className="text-xs text-slate-400">{h.selectedOption.outcome}</p>
                        <div className="text-xs text-blue-300 bg-blue-950/30 border border-blue-500/20 rounded-lg p-3">
                          <strong>Consultant Critique:</strong> {h.selectedOption.critique}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 30 / 60 / 90 Day Roadmap */}
                <div className="space-y-4">
                  <h2 className="text-lg font-bold text-white border-b border-slate-800 pb-2">
                    Tailored 30 / 60 / 90-Day Remediation Roadmap
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {[
                      {
                        title: "0–30 Days: Immediate Tactical",
                        color: "text-rose-400",
                        items: aarData?.roadmap?.days30 || [
                          `Deploy automated SOAR revocation playbooks in ${config.stack.split("+")[0]} for high-risk token replay alerts.`,
                          `Enforce hardware-backed FIDO2 MFA across all privileged roles touching ${config.crownJewels}.`,
                          `Validate out-of-band quorum locks on immutable backup repositories.`
                        ]
                      },
                      {
                        title: "30–60 Days: Architectural Hardening",
                        color: "text-amber-400",
                        items: aarData?.roadmap?.days60 || [
                          `Enforce Zero-Trust East-West micro-segmentation around the ${config.crownJewels} enclave.`,
                          `Implement automated DLP circuit-breakers and egress sinkholing for unapproved cloud storage endpoints.`,
                          `Harden golden VM/container templates and remove standing privilege from CI/CD service principals.`
                        ]
                      },
                      {
                        title: "60–90 Days: Governance & Resilience",
                        color: "text-emerald-400",
                        items: aarData?.roadmap?.days90 || [
                          `Pre-approve legal preliminary notification templates aligned with ${config.regulation} statutory windows.`,
                          `Establish quarterly purple-team validation mapped to ${config.threatActor} MITRE ATT&CK TTPs.`,
                          `Conduct clean-room restoration time-trials to validate RTO/RPO targets with executive leadership.`
                        ]
                      }
                    ].map((col) => (
                      <div key={col.title} className="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-2">
                        <div className={`text-xs font-mono uppercase font-bold ${col.color}`}>{col.title}</div>
                        <ul className="text-xs text-slate-300 space-y-2 list-disc pl-4 leading-relaxed">
                          {col.items.map((it, idx) => (
                            <li key={idx}>{it}</li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
